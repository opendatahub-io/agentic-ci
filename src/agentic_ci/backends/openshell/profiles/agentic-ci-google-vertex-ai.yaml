# OpenShell provider profile for agentic-ci's Vertex AI provider.
#
# Copied from providers/google-vertex-ai.yaml at opendatahub-io/openshell
# v0.1.2-rhaiv.0 (unchanged since v0.0.116-rhaiv.11). OpenShell no longer
# ships provider profiles in the gateway, and it removed the GCE metadata
# emulator the older google-cloud provider relied on, so agentic-ci imports
# this profile (provider.ensure_profile) before it creates a Vertex
# provider.
#
# The gateway keeps the refresh material and mints short-lived access
# tokens. The sandbox only gets GOOGLE_VERTEX_AI_SERVICE_ACCOUNT_TOKEN
# (service account) or GOOGLE_VERTEX_AI_TOKEN (gcloud ADC) as a placeholder,
# which the agent sends as its bearer token; the supervisor proxy terminates
# TLS on the endpoints below and swaps in the real token.
#
# Local changes: the id, the name, `binaries`, and the refresh timings,
# written as `refresh_before`/`max_lifetime` durations (the form the gateway
# exports; upstream writes `*_seconds`), so provider.ensure_profile finds
# the imported profile unchanged on the next run instead of updating it.
# Upstream declares no binaries. Here they are the agent binaries only, as
# in the other agentic-ci profiles: the rule OpenShell composes from this
# profile must not admit curl or any other non-agent process, or it could
# spend the token. An agent binary wrapper can still spend it, which is why
# agentic-ci detaches the provider while the setup shim's egress is open.
id: agentic-ci-google-vertex-ai
display_name: agentic-ci Google Vertex AI
description: Google Vertex AI access token for agentic-ci, with no curl rule
category: inference
inference_capable: true
credentials:
  - name: service_account_key
    description: Google service account JSON refresh bootstrap material; not injected into sandboxes
    env_vars: [GOOGLE_SERVICE_ACCOUNT_KEY]
    required: false
  - name: service_account_token
    description: Google Cloud access token refreshed from service account JWT material
    env_vars: [GOOGLE_VERTEX_AI_SERVICE_ACCOUNT_TOKEN, VERTEX_AI_SERVICE_ACCOUNT_TOKEN]
    required: false
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: google_service_account_jwt
      token_url: https://oauth2.googleapis.com/token
      scopes: [https://www.googleapis.com/auth/cloud-platform]
      refresh_before: "300s"
      max_lifetime: "3600s"
      material:
        - name: client_email
          description: Google service account email
          required: true
        - name: private_key
          description: Google service account private key
          required: true
          secret: true
        - name: subject
          description: Optional delegated user email for domain-wide delegation
  - name: gcloud_adc_token
    description: Google Cloud access token refreshed via gcloud Application Default Credentials
    env_vars: [GOOGLE_VERTEX_AI_TOKEN, VERTEX_AI_TOKEN]
    required: false
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_refresh_token
      token_url: https://oauth2.googleapis.com/token
      scopes: [https://www.googleapis.com/auth/cloud-platform]
      refresh_before: "300s"
      max_lifetime: "3600s"
      material:
        - name: client_id
          description: Google OAuth2 client ID from gcloud ADC
          required: true
        - name: client_secret
          description: Google OAuth2 client secret from gcloud ADC
          required: true
          secret: true
        - name: refresh_token
          description: Google OAuth2 refresh token from gcloud ADC
          required: true
          secret: true
discovery:
  credentials: [service_account_token, gcloud_adc_token]
endpoints:
  - host: "*-aiplatform.googleapis.com"
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: "aiplatform.googleapis.com"
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: "aiplatform.us.rep.googleapis.com"
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: "aiplatform.eu.rep.googleapis.com"
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries:
  - /usr/local/bin/claude
  - /usr/local/sbin/claude
  - /usr/local/bin/opencode
  - /usr/local/sbin/opencode
  - /usr/local/bin/codex
  - /usr/local/sbin/codex
