name: CI
on: [push, pull_request]

jobs:
  tox:
    name: Run Tox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Run all envs
        uses: fedora-python/tox-github-action@c25c758f96dfb07b749a1034846f449166fd4979 # main
        with:
          tox_env: ${{ matrix.tox_env }}
    strategy:
      matrix:
        tox_env: [py310, py311, py312, py313, lint, check-format, typecheck]
    runs-on: ubuntu-latest

  mlflow-e2e:
    name: MLflow E2E
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Run MLflow E2E tests
        run: pip install tox && tox -e mlflow-e2e
    runs-on: ubuntu-latest
