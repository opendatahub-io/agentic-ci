[tox]
envlist = py{310,311,312,313,314}, lint, check-format, typecheck

[testenv]
description = Run tests
deps =
    pytest
    pyyaml
commands = pytest {posargs:tests/ --ignore=tests/e2e/test_mlflow_e2e.py}

[testenv:lint]
description = Run code linter
deps = ruff
commands = ruff check .

[testenv:lint-fix]
description = Fix linting errors
deps = ruff
commands = ruff check --fix .

[testenv:check-format]
description = Check code formatting
deps = ruff
commands = ruff format --check --diff .

[testenv:typecheck]
description = Run type checker
deps =
    mypy
    types-protobuf
    types-PyYAML
commands = mypy src/

[testenv:format]
description = Format code
deps = ruff
commands = ruff format .

[testenv:mlflow-e2e]
description = MLflow integration e2e tests (starts a real MLflow server)
basepython = python3.12
deps =
    pytest
    mlflow
    # AnyIO 4.15's lazy imports omit anyio.from_thread, which MLflow's
    # Starlette WSGI adapter accesses directly and turns every request into 500.
    # Remove this bound once either project restores that attribute access.
    anyio<4.15
commands = pytest tests/e2e/test_mlflow_e2e.py {posargs}

[testenv:docs]
description = Build documentation
deps =
    mkdocs
    mkdocs-material
    mkdocstrings[python]
commands = mkdocs build --strict
